[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-sentinel-forge"
dynamic = ["version"]
description = "API Sentinel Forge — local-first API runtime intelligence, reliability and incident investigation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "EdgarSocrates98" }]
keywords = ["api", "observability", "slo", "incident-investigation", "opentelemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
aws = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.21",
]
mcp = [
    "mcp>=1.9",
]
tui = [
    "textual>=3.0",
]

[dependency-groups]
# Auto-installed by `uv sync` (uv-native dev workflow).
# Kept in sync with the `dev` optional-dependency extra above, which serves
# `pip install -e ".[dev]"` users.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.21",
    "types-pyyaml>=6.0.12.20260906",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
# Route the installed command through the small dispatcher so a bare
# `api-sentinel install` gets the guided wizard on a real TTY.  Pointing the
# entry point directly at the Typer object bypasses that contract in wheels.
api-sentinel = "api_sentinel.cli:main"

[project.urls]
Repository = "https://github.com/EdgarSocrates98/api-sentinel-forge"
Issues = "https://github.com/EdgarSocrates98/api-sentinel-forge/issues"

[tool.hatch.version]
path = "src/api_sentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/api_sentinel"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "contracts", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF",
    "S", "A", "C4", "DTZ", "T20", "PTH",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# vendored forge_obsidian engine — byte-parity; linted in the canonical repo.
"src/api_sentinel/_forge_obsidian/**" = ["ALL"]
"scripts/**" = ["T20"]
# lab fixtures are deliberately plain sample service code that Code Atlas
# indexes — they are not shipped product code, so security rules do not
# apply to them.
"lab/fixtures/**" = ["S"]
# the the-forge adapter is a forge/v1 stdio bridge: print() is the wire.
"adapters/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["api_sentinel"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# boto3/botocore ship no py.typed; the error code differs by platform
# (import-untyped vs import-not-found) — ignore_missing_imports covers
# both, keeping `mypy src` portable in the Windows/Linux CI matrix.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# forge_doctor_api is an optional peer integration (editable install
# only where the real seam is exercised); imports stay inside guarded
# methods — absent in CI by design, same pattern as boto3 above.
module = ["forge_doctor_api", "forge_doctor_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["slow: heavyweight integration tests (clean venv etc.)"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["api_sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
